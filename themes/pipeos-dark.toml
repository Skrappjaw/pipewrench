# pipeOS (Portal), dark: Portal 2's moody chambers, dark panels with the portals glowing. The cursor,
# tabs, titles and key chips are portal blue (Skrappjaw, 2026-10-25); ok is white, not green.
name = "pipeOS-dark"
order = 10
extends = "dark"
logo = "ansi"

[general]
screen = { fg = "#c9d1d6", bg = "#14181b" }
normal = { }
dim = { fg = "#5f6b73" }
selected = { fg = "#ffffff", bg = "#0b4a80" }
anchor = { fg = "#c9d1d6", bg = "#16283a" }
