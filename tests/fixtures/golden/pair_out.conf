    {   name = libpipewire-module-loopback
        args = {
            node.description = "GCS-8 CH 3-AUX (Music)"
            capture.props = {
                node.name = "pwctl.gcs8.out.ch3aux"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "pwctl.gcs8.out.ch3aux.hw"
                target.object = "alsa_output.usb-BOSS_GCS-8-01.pro-output-0"
                audio.position = [ AUX8 AUX9 ]
                stream.dont-remix = true
                node.passive = true
            }
        }
    }
