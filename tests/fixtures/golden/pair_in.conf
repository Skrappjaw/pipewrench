    {   name = libpipewire-module-loopback
        args = {
            node.description = "GCS-8 CH 2 (Mic)"
            capture.props = {
                node.name = "pwctl.gcs8.in.ch2.hw"
                target.object = "alsa_input.usb-BOSS_GCS-8-01.pro-input-0"
                audio.position = [ AUX6 AUX7 ]
                stream.dont-remix = true
                node.passive = true
            }
            playback.props = {
                node.name = "pwctl.gcs8.in.ch2"
                media.class = "Audio/Source"
                audio.position = [ FL FR ]
            }
        }
    }
